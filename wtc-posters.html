<script>
document.querySelectorAll('.poster-card img').forEach(function(img){
  function ready(){if(img.naturalWidth){img.parentElement.classList.add('has-image')}else{img.remove()}}
  if(img.complete)ready();else{img.addEventListener('load',ready);img.addEventListener('error',ready)}
});
